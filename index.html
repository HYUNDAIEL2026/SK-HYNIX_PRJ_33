<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>멘토링 밀도 Agent</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mu:#5d667a;--ln:#dde2ec;--red:#ea002c;--in:#eef1f7}
@media(prefers-color-scheme:dark){:root{--bg:#0f141d;--card:#18202c;--tx:#e9edf5;--mu:#9aa5ba;--ln:#2a3445;--in:#202a39}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Pretendard,'Noto Sans KR',system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--ln);background:var(--card);flex-wrap:wrap}
h1{font-size:18px;margin:0 auto 0 0;letter-spacing:-.02em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
h2{font-size:20px;margin:0 0 12px;letter-spacing:-.02em}
h3{font-size:15px;margin:0}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.sm{padding:3px 10px;font-size:13px}
.tabs button{border-radius:0;border-width:0 0 2px;background:none;padding:6px 4px;margin-right:14px;color:var(--mu)}
.tabs button.on{color:var(--tx);border-color:var(--red);font-weight:700}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
textarea{resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chips button{background:var(--in);font-size:13px;border-radius:99px;text-align:left}
.sec{margin-top:28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.best{grid-column:1/-1}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.m{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.m.top{border:2px solid var(--red);padding:20px}
.who{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.cl{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;margin-left:6px;vertical-align:1px}
.cl2{background:#2f7d5b}.cl3{background:#2457c5}.cl4{background:#7a3db8}
.badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:auto}
.mu{color:var(--mu);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--in);overflow:hidden}
.bar i{display:block;height:100%}
.temp{display:flex;align-items:center;gap:8px;font-size:13px}
.temp .bar{flex:1;max-width:140px}
.tag{display:inline-block;background:var(--in);border-radius:6px;padding:1px 8px;font-size:12px;margin:0 4px 4px 0}
.faq{background:var(--card);border:1px solid var(--ln);border-left:4px solid #2457c5;border-radius:10px;padding:16px;margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item>div{flex:1;min-width:200px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:22px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;display:none}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats b{font-size:15px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>
</head>
<body>
<header>
  <h1>멘토링 밀도 Agent<small>물어볼 질문을 먼저 짚고, 어려운 질문만 멘토에게 연결해요</small></h1>
  <nav class="tabs"><button id="t-mentee" class="on">멘티</button><button id="t-mentor">멘토</button></nav>
  <button id="set" class="sm" title="AI 설정">AI 설정</button>
</header>
<main id="app"></main>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='mentor_agent_v1';

/* ---------- 데이터 (샘플은 모두 가상) ---------- */
const P=(name,desc,kw)=>({name,desc,kw});
const seed=()=>({
 mentors:[
  {id:'m1',name:'김서연',cl:'CL3',team:'패키징기술팀',email:'seoyeon@example.com',temp:41.2,answers:18,reuse:9,
   projects:[P('HBM TSV 본딩 수율 개선','적층 본딩 공정에서 보이드와 휨 불량을 줄인 프로젝트','hbm tsv 패키징 본딩 수율 적층 휨')]},
  {id:'m2',name:'박준호',cl:'CL4',team:'공정기술팀',email:'junho@example.com',temp:52.8,answers:44,reuse:21,
   projects:[P('식각 공정 최적화','식각 균일도 개선과 공정 변동 분석','식각 etch 공정 균일도 변동 분석 불량')]},
  {id:'m3',name:'이민지',cl:'CL2',team:'품질보증팀',email:'minji@example.com',temp:38.4,answers:6,reuse:1,
   projects:[P('신뢰성 시험 체계 구축','고온 동작 수명 시험 설계와 불량 원인 분석','신뢰성 reliability 품질 시험 수명 불량')]},
  {id:'m4',name:'최도윤',cl:'CL3',team:'DRAM설계팀',email:'doyoon@example.com',temp:44.0,answers:23,reuse:12,
   projects:[P('DRAM 타이밍 검증 자동화','회로 타이밍 마진 검증 스크립트 자동화','dram 설계 검증 타이밍 회로 자동화 스크립트')]},
  {id:'m5',name:'정하은',cl:'CL2',team:'데이터분석팀',email:'haeun@example.com',temp:39.1,answers:9,reuse:4,
   projects:[P('수율 예측 모델','공정 데이터 기반 웨이퍼 수율 예측 머신러닝 모델','수율 예측 머신러닝 데이터 파이썬 웨이퍼 분석')]}
 ],
 faqs:[
  {id:'f1',q:'수율이 갑자기 떨어졌을 때 어디서부터 확인하나요?',a:'먼저 변경점(장비·소재·레시피)을 시간순으로 정리하고, 불량 맵 패턴이 특정 장비나 위치에 몰리는지 확인하세요. 그다음 해당 공정 변동 데이터를 비교합니다.',kw:'수율 불량 원인 분석 변경점',mid:'m2',views:12},
  {id:'f2',q:'신입이 처음 보고서를 쓸 때 꼭 넣어야 할 항목은?',a:'배경과 목적, 실험 조건, 결과(그래프 포함), 해석, 다음 액션 순서로 쓰고 결론을 맨 앞에 한 줄로 먼저 적으세요.',kw:'보고서 작성 신입 항목 구성',mid:'m4',views:8},
  {id:'f3',q:'HBM 패키징에서 휨(warpage)은 왜 문제가 되나요?',a:'적층 후 휨이 크면 본딩 접합 불량과 보이드가 늘어 수율이 떨어집니다. 소재 열팽창 차이와 경화 조건이 주요 원인입니다.',kw:'hbm 패키징 휨 warpage 본딩',mid:'m1',views:5}
 ],
 hist:[],
 set:{key:'',model:'gemini-2.5-flash'}
});
let S; try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mById=id=>S.mentors.find(m=>m.id===id);
let mode='mentee', last=null;

/* ---------- 유틸 ---------- */
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const tok=t=>[...new Set(String(t).toLowerCase().split(/[^a-z0-9가-힣]+/).filter(w=>w.length>=2))];
const tcol=t=>t<40?'#2563eb':t<50?'#16a34a':t<70?'#ea580c':'#dc2626';
const tempHTML=m=>`<div class="temp" title="답변과 도움됨 평가로 오르는 온도">🌡 <b style="color:${tcol(m.temp)}">${m.temp.toFixed(1)}°C</b><div class="bar"><i style="width:${Math.min(100,(m.temp-30)/70*100)}%;background:${tcol(m.temp)}"></i></div></div>`;
const nameCL=m=>`${esc(m.name)}<span class="cl ${m.cl.toLowerCase()}">${esc(m.cl)}</span>`;

/* ---------- 추천 로직 ---------- */
function localMatch(q){
 const T=tok(q);
 return S.mentors.map(m=>{
  const all=m.projects.map(p=>(p.name+' '+p.desc+' '+p.kw).toLowerCase()).join(' ')+' '+m.team.toLowerCase();
  const kws=m.projects.flatMap(p=>tok(p.kw));
  const hits=T.filter(t=>all.includes(t)||kws.some(k=>t.includes(k)));
  const proj=m.projects.filter(p=>T.some(t=>(p.name+p.desc+p.kw).toLowerCase().includes(t))).map(p=>p.name);
  return{id:m.id,
   score:Math.max(5,Math.min(99,Math.round(25+hits.length*18+(m.temp-36.5)*.3))),
   reason:hits.length?`질문의 '${hits.slice(0,3).join(', ')}'와(과) 맞닿은 경험이 있어요${proj[0]?`: ${proj.slice(0,2).join(', ')}`:''}.`:'직접 겹치는 키워드는 적지만, 응답 이력이 좋은 멘토예요.',
   proj}
 }).sort((a,b)=>b.score-a.score).slice(0,3);
}
async function aiMatch(q){
 const list=S.mentors.map(m=>({id:m.id,cl:m.cl,team:m.team,projects:m.projects.map(p=>p.name+': '+p.desc)}));
 const prompt=`너는 반도체 회사의 멘토 매칭 도우미야. 멘티 질문과 가장 관련 있는 멘토 3명을 골라 JSON 배열로만 답해. 형식: [{"id":"멘토id","score":0~100,"reason":"2문장, 어떤 프로젝트 경험과 연결되는지 구체적으로"}]\n질문: ${q}\n멘토: ${JSON.stringify(list)}`;
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.set.model)}:generateContent`,{
  method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.set.key},
  body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
 if(!r.ok)throw new Error(r.status);
 const j=await r.json(), a=JSON.parse(j.candidates[0].content.parts[0].text);
 return a.filter(x=>mById(x.id)).slice(0,3).map(x=>({id:x.id,score:Math.round(x.score),reason:x.reason,proj:[]})).sort((a,b)=>b.score-a.score);
}
function faqMatch(q){
 const T=tok(q);let best=null,bs=0;
 S.faqs.forEach(f=>{const x=(f.q+' '+f.kw).toLowerCase();const n=T.filter(t=>x.includes(t)).length;if(n>bs){bs=n;best=f}});
 return bs>=2?best:null;
}

/* ---------- 멘티 화면 ---------- */
function suggestions(){
 const ps=S.mentors.flatMap(m=>m.projects.map(p=>p.name));
 return ps.sort(()=>Math.random()-.5).slice(0,4).map(n=>`'${n}' 관련해서 처음 알아야 할 것은 무엇인가요?`);
}
function renderMentee(){
 $('#app').innerHTML=`
 <h2>무엇이 궁금한가요?</h2>
 <textarea id="q" rows="3" placeholder="예) HBM 패키징에서 수율이 떨어지는 원인을 어떻게 분석하나요?"></textarea>
 <div style="margin-top:10px"><button class="pri" id="ask">질문하기</button></div>
 <div class="chips" aria-label="추천 질문">${suggestions().map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <div id="res"></div>
 <div class="sec"><h2>내 질문 기록</h2><div id="hist"></div></div>`;
 $('#ask').onclick=ask;
 document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.s;ask()});
 renderHist();
}
async function ask(){
 const q=$('#q').value.trim();
 if(!q){toast('질문을 입력해 주세요');return}
 last=q;
 const faq=faqMatch(q);
 if(faq){
  $('#res').innerHTML=`<div class="sec"><div class="faq"><h3>💡 비슷한 질문의 FAQ가 있어요</h3>
   <p><b>${esc(faq.q)}</b></p><p>${esc(faq.a)}</p>
   <p class="mu">정리해 준 멘토: ${esc(mById(faq.mid)?.name||'')} · 조회 ${faq.views}회</p>
   <button class="pri sm" id="solved">해결됐어요</button> <button class="sm" id="more">그래도 멘토에게 물어볼래요</button></div></div>`;
  $('#solved').onclick=()=>{faq.views++;const m=mById(faq.mid);if(m){m.reuse++;m.temp=Math.min(99,m.temp+.1)}save();$('#res').innerHTML='';toast('해결됐어요! FAQ를 정리한 멘토의 지식 수율에 반영돼요');};
  $('#more').onclick=()=>showMentors(q);
  return;
 }
 showMentors(q);
}
async function showMentors(q){
 $('#res').innerHTML='<div class="sec mu">적합한 멘토를 찾는 중…</div>';
 let r;
 if(S.set.key){try{r=await aiMatch(q)}catch(e){toast('AI 호출에 실패해서 기본 추천으로 보여줘요')}}
 if(!r)r=localMatch(q);
 $('#res').innerHTML=`<div class="sec"><h2>추천 멘토 ${r.length}명</h2><div class="row">${r.map((x,i)=>{
  const m=mById(x.id);
  return `<article class="m ${i?'':'top best'}">
   <div class="who"><div class="av">${esc(m.name[0])}</div><div><h3>${nameCL(m)}</h3><span class="mu">${esc(m.team)}</span></div>${i?'':'<span class="badge">⭐ 가장 추천</span>'}</div>
   <div><span class="mu">적합도 ${x.score}%</span><div class="bar"><i style="width:${x.score}%;background:var(--red)"></i></div></div>
   <p style="margin:0">${esc(x.reason)}</p>
   <div>${m.projects.map(p=>`<span class="tag">${esc(p.name)}</span>`).join('')}</div>
   ${tempHTML(m)}
   <button class="pri" data-c="${m.id}">연결하기</button></article>`}).join('')}</div></div>`;
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>connect(b.dataset.c,q));
}
function connect(id,q){
 const m=mById(id);
 $('#dlg').innerHTML=`<h2>${esc(m.name)} ${esc(m.cl)}님께 질문 보내기</h2>
  <label>내 이름</label><input id="me">
  <label>소속</label><input id="mt">
  <label>이미 확인해 본 것 (FAQ, 자료 등)</label><input id="tried" placeholder="없으면 비워두세요">
  <label>메일 내용</label><textarea id="body" rows="8"></textarea>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button id="x">취소</button><button class="pri" id="send">메일 앱으로 보내기</button></div>`;
 const build=()=>{$('#body').value=`안녕하세요 ${m.name} ${m.cl}님,\n${$('#mt').value||'○○팀'} ${$('#me').value||'○○○'}입니다.\n\n${m.projects[0].name} 경험을 바탕으로 도움을 구하고 싶어 연락드립니다.\n\n[질문]\n${q}\n\n[확인해 본 것]\n${$('#tried').value||'아직 정리한 내용이 없습니다.'}\n\n바쁘신 중에 죄송하지만, 가능하실 때 짧게라도 방향을 알려주시면 큰 도움이 되겠습니다.\n감사합니다.`};
 $('#dlg').showModal();build();
 ['me','mt','tried'].forEach(i=>$('#'+i).oninput=build);
 $('#x').onclick=()=>$('#dlg').close();
 $('#send').onclick=()=>{
  const sub=`[멘토링 질문] ${q.slice(0,40)}`;
  location.href=`mailto:${m.email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent($('#body').value)}`;
  S.hist.unshift({id:Date.now(),q,mid:id,st:'sent'});save();$('#dlg').close();toast('연결 요청을 보냈어요');renderHist();
 };
}
function renderHist(){
 const h=$('#hist');if(!h)return;
 h.innerHTML=S.hist.length?S.hist.map(x=>{const m=mById(x.mid);return `<div class="item"><div><b>${esc(x.q)}</b><div class="mu">${esc(m?.name||'')} ${esc(m?.cl||'')}</div></div>
  ${x.st==='sent'?`<span class="mu">답변을 받았나요?</span><button class="sm" data-r="up" data-i="${x.id}">도움됐어요</button><button class="sm" data-r="down" data-i="${x.id}">아쉬웠어요</button>`:`<span class="mu">${x.st==='up'?'도움됐어요':'아쉬웠어요'}로 기록됨</span>`}</div>`}).join(''):'<p class="mu">아직 보낸 질문이 없어요. 위에서 질문을 입력해 보세요.</p>';
 h.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
  const x=S.hist.find(y=>y.id==b.dataset.i),m=mById(x.mid);x.st=b.dataset.r;
  if(m){m.answers++;m.temp=Math.max(30,Math.min(99,m.temp+(x.st==='up'?1:-.3)))}save();renderHist();toast('평가가 멘토 온도에 반영됐어요');
 });
}

/* ---------- 멘토 화면 ---------- */
function renderMentor(){
 const rank=[...S.mentors].sort((a,b)=>b.temp-a.temp);
 $('#app').innerHTML=`
 <h2>멘토 지식 수율</h2>
 ${rank.map((m,i)=>`<div class="item"><b>${i+1}</b><div><b>${nameCL(m)}</b> <span class="mu">${esc(m.team)}</span>
   <div class="stats mu">답변 <b>${m.answers}</b>건 · FAQ 재사용 <b>${m.reuse}</b>회</div></div>${tempHTML(m)}
   <button class="sm" data-d="${m.id}">삭제</button></div>`).join('')}
 <div class="sec"><h2>FAQ 목록</h2>${S.faqs.map(f=>`<div class="faq"><b>${esc(f.q)}</b><p>${esc(f.a)}</p><span class="mu">${esc(mById(f.mid)?.name||'')} · 조회 ${f.views}회</span></div>`).join('')}</div>
 <div class="sec"><h2>내 프로필 등록</h2>
  <label>이름</label><input id="n"><label>직급</label><select id="c"><option>CL2</option><option selected>CL3</option><option>CL4</option></select>
  <label>소속 팀</label><input id="t"><label>이메일</label><input id="e" type="email">
  <label>경험한 프로젝트 (한 줄에 하나: 프로젝트명 | 설명 | 키워드 공백 구분)</label>
  <textarea id="p" rows="4" placeholder="HBM 본딩 수율 개선 | 적층 불량 감소 | hbm 본딩 수율"></textarea>
  <div style="margin-top:12px"><button class="pri" id="add">프로필 등록</button></div></div>`;
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('이 멘토를 삭제할까요?')){S.mentors=S.mentors.filter(m=>m.id!==b.dataset.d);save();renderMentor()}});
 $('#add').onclick=()=>{
  const projects=$('#p').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]).map(a=>P(a[0],a[1]||'',a[2]||a[0]));
  if(!$('#n').value.trim()||!$('#e').value.trim()||!projects.length){toast('이름, 이메일, 프로젝트를 입력해 주세요');return}
  S.mentors.push({id:'m'+Date.now(),name:$('#n').value.trim(),cl:$('#c').value,team:$('#t').value.trim(),email:$('#e').value.trim(),temp:36.5,answers:0,reuse:0,projects});
  save();renderMentor();toast('프로필이 등록됐어요');
 };
}

/* ---------- AI 설정 ---------- */
$('#set').onclick=()=>{
 $('#dlg').innerHTML=`<h2>AI 설정 (선택)</h2>
  <p class="mu">비워두면 키워드 기반 추천을 써요. Gemini 키를 넣으면 AI가 질문 의미까지 보고 추천해요. 키는 이 브라우저에만 저장되며, 공용 사이트에는 개인 키 사용을 권장하지 않아요.</p>
  <label>Gemini API 키</label><input id="k" type="password" value="${esc(S.set.key)}" autocomplete="off">
  <label>모델 이름</label><input id="mo" value="${esc(S.set.model)}">
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button id="x">닫기</button><button class="pri" id="ok">저장</button></div>`;
 $('#dlg').showModal();
 $('#x').onclick=()=>$('#dlg').close();
 $('#ok').onclick=()=>{S.set.key=$('#k').value.trim();S.set.model=$('#mo').value.trim()||'gemini-2.5-flash';save();$('#dlg').close();toast('저장했어요')};
};

/* ---------- 탭 ---------- */
function go(m){mode=m;$('#t-mentee').classList.toggle('on',m==='mentee');$('#t-mentor').classList.toggle('on',m==='mentor');m==='mentee'?renderMentee():renderMentor()}
$('#t-mentee').onclick=()=>go('mentee');$('#t-mentor').onclick=()=>go('mentor');
go('mentee');
</script>
</body>
</html>
